# Docker's embedded DNS server -- resolving "backend"/"frontend" through it
# with a short TTL (rather than the `upstream { server backend:8080; }` form,
# which resolves once at nginx startup/reload and then caches that IP for
# the process's whole lifetime) means a `docker compose up -d --build backend`
# that recreates just that one container -- giving it a new IP on the docker
# network -- doesn't silently strand this nginx pointing at the now-dead old
# IP until someone thinks to `nginx -s reload` it by hand. Confirmed the hard
# way: after a backend-only rebuild, every request here failed with the
# backend's own "invalid token" response despite genuinely valid tokens,
# because nginx was still connecting to the previous container.
resolver 127.0.0.11 valid=10s;

# TLS terminates once at the VPS's host-level nginx (which fronts 80/443 for
# every site on the box, this one included); it forwards plain HTTP to this
# container on an internal-only port (see docker-compose.yml). So this is a
# single plain server block, not the usual 80-redirects-to-443 pair -- an
# internal redirect-to-https here would just loop against the host nginx
# that already enforced HTTPS before the request got this far.
server {
    listen 80;
    server_name _;

    # Health check bypass for load balancer
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Security HTTP Response Headers (Helmet Equivalence at Reverse Proxy)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Enable large upload limits for Mastheads, Stamps, Logos (up to 100MB)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Protect against too many simultaneous TCP connections from a single IP
    limit_conn conn_throttle 20;

    # The two endpoints the host nginx's auth_request calls to decide whether
    # a browser may be served a page at all. Reachable only from inside the
    # compose network (the host nginx is the only thing in front of this
    # port); the host config returns 404 for /internal/ on public traffic, so
    # a visitor can never poke at them directly.
    location /internal/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $http_x_original_uri;
    }

    # Route 1: Sensitive Authentication & Token Refresh (Strict Brute-Force Rate Limiting)
    location /api/v1/auth/login {
        limit_req zone=auth_throttle burst=3 nodelay;
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route 2: Core REST API & Webhooks
    location /api/v1/ {
        limit_req zone=api_throttle burst=50 nodelay;
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Route 3: Next.js 15 App Router Frontend (Supports WebSockets and Server Streaming)
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

upstream frontend_server {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream api_server {
    server backend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP to HTTPS automatic redirection server block
server {
    listen 80;
    server_name portal.newspaper-erp.com api.newspaper-erp.com localhost;

    # Health check bypass for load balancer
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production SSL Virtual Host
server {
    listen 443 ssl http2;
    server_name portal.newspaper-erp.com localhost;

    # SSL Certs (Assumed generated via Let's Encrypt / Cloudflare Edge Certs in ./ssl)
    # For initial testing without certs, comment out or supply self-signed dev certs
    # ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # ssl_prefer_server_ciphers on;

    # Security HTTP Response Headers (Helmet Equivalence at Reverse Proxy)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Enable large upload limits for Mastheads, Stamps, Logos (up to 100MB)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Protect against too many simultaneous TCP connections from a single IP
    limit_conn conn_throttle 20;

    # Route 1: Sensitive Authentication & Token Refresh (Strict Brute-Force Rate Limiting)
    location /api/v1/auth/login {
        limit_req zone=auth_throttle burst=3 nodelay;
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route 2: Core REST API & Webhooks
    location /api/v1/ {
        limit_req zone=api_throttle burst=50 nodelay;
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Route 3: Next.js 15 App Router Frontend (Supports WebSockets and Server Streaming)
    location / {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

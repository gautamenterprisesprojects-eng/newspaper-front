# Host-level nginx for the portal, with the device gate.
#
# Installed at /etc/nginx/sites-available/pagemint1.gautamenterprises.org on
# the VPS. Kept in the repo because the gate is the piece that can lock every
# user out, and a config that exists only on one server cannot be reviewed,
# diffed or restored.
#
# The gate asks the backend (through the compose nginx on :8091) whether the
# browser's device cookie belongs to a live, unrevoked device. The backend
# answers 200 for everything while DEVICE_GATE_ENABLED is false, so this file
# is safe to install before the cutover.
#
# What is deliberately NOT gated:
#   /api/v1/   -- carries bearer tokens, not cookies. The generator's billing
#                 callback is cross-origin and sends no cookie at all, so
#                 gating it here would break every export. The device claim
#                 inside the JWT covers this surface instead.
#   /enrol     -- the one door an unenrolled browser must reach, or no new
#                 device could ever be registered.
#   /_next/    -- static assets, needed by both /enrol and the 403 page.

server {
    server_name pagemint1.gautamenterprises.org;

    client_max_body_size 100M;

    # The auth_request subrequest itself. `internal` means a visitor cannot
    # request this path directly.
    location = /_device_check {
        internal;
        proxy_pass http://127.0.0.1:8091/internal/device-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # A blocked browser gets a plain page with the number to call -- not a
    # bare nginx 403, which reads as "the site is broken" and produces a
    # support call with no information in it.
    error_page 403 /device-blocked.html;
    location = /device-blocked.html {
        root /var/www/pagemint-static;
        internal;
    }

    # Never expose the gate endpoints themselves to the public.
    location /internal/ {
        return 404;
    }

    # Bearer-token surface: gated by the JWT's device claim, not by cookies.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The enrolment door and the assets it needs.
    location /enrol {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -- every real page of the portal -- requires a device.
    location / {
        auth_request /_device_check;

        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pagemint1.gautamenterprises.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pagemint1.gautamenterprises.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pagemint1.gautamenterprises.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name pagemint1.gautamenterprises.org;
    return 404; # managed by Certbot
}

# Host-level nginx for the generator, with the launch gate.
#
# Installed at /etc/nginx/sites-available/generator.pagemint1.gautamenterprises.org.
#
# The generator opens only for a real dashboard launch. The dashboard mints a
# short-lived HMAC-signed token and puts it in the URL alongside the launch
# parameters it already sends; this config asks the portal backend whether
# that token is genuine before serving the page. Pasting the generator URL
# into a browser -- even an enrolled one -- gets nothing.
#
# Only the HTML document is gated. Static assets and the generator's own API
# routes are not, deliberately:
#
#   * A batch run loads this app in a hidden iframe. Anything that depended
#     on a cookie here would work for most publishers and fail for the ones
#     whose browser blocks third-party cookies -- the worst kind of bug.
#     The token in the URL has no such failure mode, and the document
#     request is the only one that carries it.
#   * The token lives six hours, so a long editing session survives a page
#     refresh; the URL in the address bar still has it.

# Pull just the launch token out of the original request line.
#
# Two dead ends got us here, both worth recording. Passing the whole
# $request_uri to the check endpoint works -- a subrequest does see the
# parent's URI -- but a real launch URL carries the page plan, the section
# config and the JWT, so the header blew the backend's limit and the
# subrequest answered 431. Using $arg_lt inside the auth location fails the
# other way: the subrequest's own URI is /_launch_check, which has no query
# string at all, so the variable is always empty and every launch was
# refused. Matching against $request_uri here gives the token, and only the
# token. This sits in http context, which is where sites-enabled files are
# included, so the map is legal at the top of the file.
map $request_uri $pagemint_launch_token {
    default "";
    "~[?&]lt=(?<captured_token>[^&]+)" $captured_token;
}

server {
    server_name generator.pagemint1.gautamenterprises.org;

    client_max_body_size 100M;

    # Loaded two ways: a normal top-level navigation (single-page generation),
    # and embedded in a hidden <iframe> by the portal for batch generation.
    # frame-ancestors names that one origin explicitly -- X-Frame-Options
    # cannot express "this one other origin", only DENY/SAMEORIGIN.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self' https://pagemint1.gautamenterprises.org;" always;

    location = /_launch_check {
        internal;
        proxy_pass http://127.0.0.1:8091/internal/generator-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        # Just the token (see the map above), never the whole request line.
        proxy_set_header X-Launch-Token $pagemint_launch_token;
        proxy_set_header X-Original-URI "";
    }

    error_page 403 /generator-blocked.html;
    location = /generator-blocked.html {
        root /var/www/pagemint-static;
        internal;
    }

    # Ungated: the app's own bundle, fonts and images, plus its server routes
    # (newswire, editorial, print-image). None of these are reachable in a
    # useful way without the document that drives them.
    location /_next/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The document itself: requires a genuine dashboard launch token.
    location / {
        auth_request /_launch_check;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pagemint1.gautamenterprises.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pagemint1.gautamenterprises.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = generator.pagemint1.gautamenterprises.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name generator.pagemint1.gautamenterprises.org;
    return 404; # managed by Certbot
}

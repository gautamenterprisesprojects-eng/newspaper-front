<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageMint — डैशबोर्ड से खोलें</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #F6F8F7; color: #0F1A17; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6;
  }
  .card {
    background: #fff; border: 1px solid #DDE5E2; border-radius: 16px; padding: 32px 28px;
    max-width: 440px; width: 100%; text-align: center;
  }
  h1 { font-size: 1.35rem; margin: 0 0 12px; }
  p { margin: 0 0 16px; color: #4A5A55; font-size: 0.95rem; }
  a.btn {
    display: block; margin-top: 22px; padding: 13px 18px; border-radius: 10px;
    text-decoration: none; font-weight: 600; font-size: 0.95rem;
    background: #0E7C66; color: #fff;
  }
  .note { font-size: 0.8rem; color: #7C8A86; margin: 20px 0 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>पेज मेकर सीधे नहीं खुलता</h1>
    <!-- The most common cause is not an attack but an old bookmark or a
         six-hour-stale tab, so the first thing offered is the way back in. -->
    <p>अख़बार बनाने के लिए पहले डैशबोर्ड खोलें और वहीं से "पेज बनाएं" पर जाएं. सीधे इस पते से यह पेज नहीं खुलेगा.</p>
    <p>अगर आप काफ़ी देर से यही टैब खोले बैठे थे, तो डैशबोर्ड से दोबारा शुरू करें.</p>
    <a class="btn" href="https://pagemint1.gautamenterprises.org/dashboard">डैशबोर्ड खोलें</a>
    <p class="note">दिक़्क़त हो तो एडमिन से संपर्क करें — 7999079051</p>
  </div>
</body>
</html>
